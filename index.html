<body>
<div id="app">
  <canvas id="scene"></canvas>
  <div id="labels"></div>

  <header id="topbar">
    <div class="brand">
      <div class="logo"><span></span></div>
      <div class="brand-text">
        <div class="t1">Evergate AI Office</div>
        <div class="t2" id="company">EVERGATE HOLDING SDN BHD</div>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-view="office">办公室</button>
      <button class="tab" data-view="board">任务板 <b id="confirmBadge" class="badge">0</b></button>
      <button class="tab" data-view="directory">部门总览</button>
      <a class="tab" href="./dashboard.html">Dashboard</a>
    </nav>
    <button type="button" id="dayToggle" class="daytog" aria-label="日夜预览">自动</button>
    <div class="summary" id="summary"></div>
  </header>

  <div id="quickbar">
    <button type="button" id="homeBtn">回到全景</button>
    <button type="button" id="moreDepts">更多部门</button>
    <div id="quickscroll"></div>
  </div>

  <button type="button" id="feedToggle" class="feedtog" aria-expanded="false" aria-controls="feedTray">查看动态</button>
  <div id="legend">
    <span><i class="dot busy"></i>忙碌</span>
    <span><i class="dot confirm"></i>等你确认</span>
    <span><i class="dot idle"></i>空闲</span>
    <span class="upd" id="updated"></span>
  </div>

  <aside id="panel" class="hidden" aria-live="polite">
    <button type="button" class="grab" id="panelExpand" aria-expanded="false">展开</button>
    <button class="close" id="panelClose" aria-label="关闭">✕</button>
    <div id="panelBody"></div>
  </aside>

  <section id="directory" class="hidden" aria-label="部门总览">
    <div class="board-head dir-head">
      <h2>部门总览</h2>
      <button class="close" id="dirClose" aria-label="关闭">✕</button>
      <div class="seg" id="dirMode">
        <button type="button" data-mode="status" class="on">按状态</button>
        <button type="button" data-mode="group">按类别</button>
      </div>
    </div>
    <div id="dirBody"></div>
  </section>

  <section id="board" class="hidden">
    <div class="board-head">
      <h2>任务板</h2>
      <div class="seg" id="boardMode">
        <button type="button" data-mode="tasks" class="on">任务</button>
        <button type="button" data-mode="grades">考核</button>
        <button type="button" data-mode="bars">分数</button>
      </div>
      <button class="close" id="boardClose" aria-label="关闭">✕</button>
    </div>
    <div id="boardStats"></div>
    <div class="cols" id="boardCols"></div>
  </section>

  <div id="navfab">
    <div id="navfabMenu" class="hidden" role="menu">
      <button type="button" data-view="board">任务板</button>
      <button type="button" data-view="directory">部门总览</button>
      <a href="./dashboard.html">Dashboard</a>
    </div>
    <button type="button" id="navfabBtn" aria-label="打开任务板或部门总览" aria-expanded="false">☰</button>
  </div>

  <div id="loading"><div class="spin"></div><div>正在布置办公室…</div></div>
</div>
<script src="./brand-theme.js"></script>
</body>
</html>
